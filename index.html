<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과천여자고등학교 진학상담 프로그램</title>
<link rel="icon" href="./crest.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ── 표지 (로딩 / 명단 올리기 / 차단 / 관리자) ── -->
<section id="cover" class="cover">
  <div class="gridlines"></div><div class="glow"></div><div class="hairline"></div>
  <img class="wm" src="./crest.png" alt="">
  <div class="cv-head">
    <div class="cv-id">
      <div class="cv-chip"><img src="./crest.png" alt=""></div>
      <div class="en2">GWACHEON WOMANS HIGH SCHOOL</div>
    </div>
    <div class="cv-pills" id="cv-pills"></div>
  </div>
  <div id="cv-body"></div>
</section>

<!-- ── 상담 화면 ── -->
<div id="app" class="app hidden">
  <aside class="sb">
    <img class="sb-wm" src="./crest.png" alt="">
    <div class="sb-inner">
      <div class="sb-id">
        <div class="sb-chip"><img src="./crest.png" alt=""></div>
        <div class="en2">GWACHEON WOMANS<br>HIGH SCHOOL</div>
      </div>
      <div class="sb-title">과천여자고등학교<br><span class="accent">진학상담 프로그램</span></div>
      <div class="sb-sub">COLLEGE ADMISSION COUNSELING</div>

      <div class="sb-scope" id="sb-scope"></div>

      <div class="sbl">상담 유형</div>
      <div class="chips mode" id="modechips">
        <button class="chip" data-mode="susi" aria-pressed="true">수시·정시<small id="m-susi">명단 없음</small></button>
        <button class="chip" data-mode="jg" aria-pressed="false">정시만<small id="m-jg">명단 없음</small></button>
        <button class="chip hidden" id="c-mode-sel" data-mode="sel" aria-pressed="false">과목 선택<small id="m-sel">1·2학년</small></button>
      </div>

      <div id="sb-sel" class="hidden">
        <div class="sbl">학년</div>
        <div class="chips" id="selgrade">
          <button class="chip" data-g="1" aria-pressed="true">1학년 <span class="wn">→ 2학년 선택</span></button>
          <button class="chip" data-g="2">2학년 <span class="wn">→ 3학년 선택</span></button>
        </div>
        <div class="sbl">희망 분야 <span class="wn">최대 3개</span></div>
        <input type="search" id="selq" placeholder="분야 이름으로 찾기">
        <div class="fwrap" id="selfwrap"><div class="fbox darkscroll" id="selfbox"></div></div>
        <div class="picked" id="selpicked"></div>
        <div id="sb-selstu" class="hidden">
          <div class="sbl">학생 선택</div>
          <div class="row2"><select id="selcls"></select><select id="selstu"></select></div>
        </div>
      </div>

      <div id="sb-stupick">
      <div class="sbl">학생 선택</div>
      <div class="row2"><select id="cls"></select><select id="stu"></select></div>
      <input type="search" id="q" placeholder="이름으로 찾기">
      <div id="stucard" class="sb-stu hidden"></div>

      </div>

      <div id="sb-cond">
      <div class="sbl">성적 조건</div>
      <div id="in-susi">
        <div class="gpa-in">
          <label>내신 전교과 <span class="req">*</span> <span id="gpanote" class="gpanote"></span></label>
          <div class="gpa-row">
            <div class="gcard">
              <div class="cbt">전교과</div>
              <div class="cbv">
                <div id="gpa5c" class="hidden"><span>5등급</span><b id="gpa5">—</b></div>
                <div><span>9등급</span>
                  <input type="number" id="gpa" step="0.01" min="1" max="9" placeholder="3.45"></div>
              </div>
            </div>
            <div class="gcard" id="gpasubs"></div>
          </div>
        </div>
        <label class="lbl">수능 / 모의고사 등급 <span class="wn">(선택)</span></label>
        <div class="sg">
          <div><label>국</label><input type="number" id="c_k" min="1" max="9"></div>
          <div><label>수</label><input type="number" id="c_m" min="1" max="9"></div>
          <div><label>영</label><input type="number" id="c_e" min="1" max="9"></div>
          <div><label>탐1</label><input type="number" id="c_s1" min="1" max="9"></div>
          <div><label>탐2</label><input type="number" id="c_s2" min="1" max="9"></div>
        </div>
      </div>
      <div id="in-jg" class="hidden">
        <label class="lbl">백분위 <span class="req">*</span> <span class="wn">국·수·탐1·탐2 중 3개 이상</span></label>
        <div class="sg4">
          <div><label>국</label><input type="number" id="p_k" min="0" max="100"></div>
          <div><label>수</label><input type="number" id="p_m" min="0" max="100"></div>
          <div><label>탐1</label><input type="number" id="p_s1" min="0" max="100"></div>
          <div><label>탐2</label><input type="number" id="p_s2" min="0" max="100"></div>
        </div>
        <label class="lbl">영어 등급 <span class="wn">(선택 · 절대평가)</span></label>
        <div class="sg4"><div><input type="number" id="p_e" min="1" max="9" placeholder="등급"></div></div>
      </div>

      <label class="lbl">희망 계열</label>
      <div class="chips" id="gychips">
        <button class="chip" data-gy="-1" aria-pressed="true">전체</button>
        <button class="chip" data-gy="0">인문사회</button>
        <button class="chip" data-gy="1">자연공학</button>
        <button class="chip" data-gy="2">의약보건</button>
        <button class="chip" data-gy="3">예체능</button>
      </div>

      </div>

      <div class="row2 mt" id="sb-nums">
        <div><label class="lbl">유사 학생 수</label>
          <select id="topn"><option>10</option><option>15</option><option selected>20</option><option>30</option><option>50</option></select></div>
        <div><label class="lbl">대상 연도</label>
          <select id="yrs"><option value="3">최근 3개년</option><option value="5" selected>최근 5개년</option><option value="6">6개년 전체</option></select></div>
      </div>

      <div class="sb-actions">
        <button class="sb-btn" id="btn-roster">명단 다시 올리기</button>
        <button class="sb-btn ghost" id="btn-wipe">이 컴퓨터에서 자료 지우기</button>
      </div>
      <div class="sb-foot">서버 전송 없음 · 명단은 이 브라우저 안에서만</div>
    </div>
  </aside>

  <main class="content">
    <div id="results" class="hidden">
      <div class="shead"><span class="tick"></span><h2 id="rtitle">유사 사례</h2>
        <span class="snote" id="rnote"></span></div>
      <div class="stats" id="stats"></div>
      <div id="headline"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="stu" aria-selected="true"><span id="t-stu">유사 학생</span><span class="c" id="c-stu"></span></button>
        <button class="tab" role="tab" data-t="univ" aria-selected="false"><span id="t-univ">대학·전형</span><span class="c" id="c-univ"></span></button>
        <button class="tab" role="tab" data-t="track" aria-selected="false"><span id="t-track">카드 배분</span></button>
        <button class="tab" role="tab" data-t="jg" aria-selected="false"><span id="t-jg">정시</span><span class="c" id="c-jg"></span></button>
      </div>
      <div id="p-stu"></div>
      <div id="p-univ" class="hidden"></div>
      <div id="p-track" class="hidden"></div>
      <div id="p-jg" class="hidden"></div>
    </div>
    <div id="selview" class="hidden">
      <div class="shead"><span class="tick"></span><h2 id="seltitle">선택과목 구성</h2>
        <span class="snote" id="selnote"></span></div>
      <div class="tabs" id="seltabs" role="tablist">
        <button class="tab" role="tab" data-s="pick" aria-selected="true"><span>과목 고르기</span></button>
        <button class="tab" role="tab" data-s="cond" aria-selected="false"><span>대학이 붙인 조건</span><span class="c" id="c-scond"></span></button>
        <button class="tab" role="tab" data-s="miss" aria-selected="false"><span>우리 학교에 없는 과목</span><span class="c" id="c-smiss"></span></button>
        <button class="tab" role="tab" data-s="univ" aria-selected="false"><span>대학별 결과</span><span class="c" id="c-suniv"></span></button>
      </div>
      <div id="s-pick"></div>
      <div id="s-univ" class="hidden"></div>
      <div id="s-cond" class="hidden"></div>
      <div id="s-miss" class="hidden"></div>
    </div>
    <div class="empty" id="placeholder">
      왼쪽에서 <b>학생을 선택</b>하면 성적이 비슷했던 졸업생들의 지원 결과가 여기에 표시됩니다.<br>
      <span class="fine">명단에 없으면 내신 전교과를 직접 입력해도 됩니다.</span>
    </div>
  </main>
</div>

<!-- 사례 하나를 크게 보는 창. 목록에서 카드를 누르면 열립니다. -->
<div class="mask" id="mask" role="dialog" aria-modal="true" aria-label="졸업생 사례">
  <div class="md" id="md">
    <div class="md-h">
      <span class="cnt" id="md-cnt"></span><span class="yr" id="md-yr"></span>
      <button class="md-x" id="md-x" title="닫기" aria-label="닫기">✕</button>
    </div>
    <div class="md-s">
      <div class="big" id="md-big"></div>
      <div class="sc" id="md-sc"></div>
      <div class="res" id="md-res"></div>
    </div>
    <div class="md-b" id="md-b"></div>
    <div class="md-f">
      <button class="md-nav" id="md-prev">← 이전 사례</button>
      <button class="md-nav" id="md-next">다음 사례 →</button>
      <button class="md-nav close" id="md-close">닫기</button>
    </div>
  </div>
</div>

<input type="file" id="f-roster" accept=".xlsx,.xls" hidden>
<input type="file" id="f-history" accept=".xlsx,.xls" hidden>
<input type="file" id="f-mock" accept=".xls,.xlsx,.html,.htm" multiple hidden>
<input type="file" id="f-cut" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="f-jg" accept=".xlsb,.xlsx,.xls" hidden>
<input type="file" id="f-sel" accept=".xlsx,.xls" hidden>
<input type="file" id="f-choice" accept=".xlsx,.xls" multiple hidden>
<input type="file" id="f-choice-adm" accept=".xlsx,.xls" multiple hidden>

<script src="./vendor/xlsx.full.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
