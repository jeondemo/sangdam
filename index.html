<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과천여자고등학교 진학상담 프로그램</title>
<link rel="icon" href="./crest.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ── 표지 (로딩 / 명단 올리기 / 차단 / 관리자) ── -->
<section id="cover" class="cover">
  <div class="gridlines"></div><div class="glow"></div><div class="hairline"></div>
  <img class="wm" src="./crest.png" alt="">
  <div class="cv-head">
    <div class="cv-id">
      <div class="cv-chip"><img src="./crest.png" alt=""></div>
      <div class="en2">GWACHEON WOMANS HIGH SCHOOL</div>
    </div>
    <div class="cv-pills" id="cv-pills"></div>
  </div>
  <div id="cv-body"></div>
</section>

<!-- ── 상담 화면 ── -->
<div id="app" class="app hidden">
  <aside class="sb">
    <img class="sb-wm" src="./crest.png" alt="">
    <div class="sb-inner">
      <div class="sb-id">
        <div class="sb-chip"><img src="./crest.png" alt=""></div>
        <div class="en2">GWACHEON WOMANS<br>HIGH SCHOOL</div>
      </div>
      <div class="sb-title">과천여자고등학교<br><span class="accent">진학상담 프로그램</span></div>
      <div class="sb-sub">COLLEGE ADMISSION COUNSELING</div>

      <div class="sb-scope" id="sb-scope"></div>

      <div class="sbl">학생 선택</div>
      <div class="row2"><select id="cls"></select><select id="stu"></select></div>
      <input type="search" id="q" placeholder="이름으로 찾기">
      <div id="stucard" class="sb-stu hidden"></div>

      <div class="sbl">성적 조건</div>
      <div class="gpa-in">
        <label>내신 전교과 <span class="req">*</span> <span id="gpanote" class="gpanote"></span></label>
        <input type="number" id="gpa" step="0.01" min="1" max="9" placeholder="3.45">
      </div>
      <label class="lbl">수능 / 모의고사 등급 <span class="wn">(선택)</span></label>
      <div class="sg">
        <div><label>국</label><input type="number" id="c_k" min="1" max="9"></div>
        <div><label>수</label><input type="number" id="c_m" min="1" max="9"></div>
        <div><label>영</label><input type="number" id="c_e" min="1" max="9"></div>
        <div><label>탐1</label><input type="number" id="c_s1" min="1" max="9"></div>
        <div><label>탐2</label><input type="number" id="c_s2" min="1" max="9"></div>
      </div>

      <label class="lbl">희망 계열</label>
      <div class="chips" id="gychips">
        <button class="chip" data-gy="-1" aria-pressed="true">전체</button>
        <button class="chip" data-gy="0">인문사회</button>
        <button class="chip" data-gy="1">자연공학</button>
        <button class="chip" data-gy="2">의약보건</button>
        <button class="chip" data-gy="3">예체능</button>
      </div>

      <label class="lbl">지원 유형</label>
      <div class="chips" id="catchips">
        <button class="chip" data-cat="0" aria-pressed="true">4년제만</button>
        <button class="chip" data-cat="-1">전문대 포함</button>
      </div>

      <div class="row2 mt">
        <div><label class="lbl">유사 학생 수</label>
          <select id="topn"><option>10</option><option>15</option><option selected>20</option><option>30</option><option>50</option></select></div>
        <div><label class="lbl">대상 연도</label>
          <select id="yrs"><option value="3">최근 3개년</option><option value="5" selected>최근 5개년</option><option value="6">6개년 전체</option></select></div>
      </div>

      <div class="sb-actions">
        <button class="sb-btn" id="btn-roster">명단 다시 올리기</button>
        <button class="sb-btn ghost" id="btn-wipe">이 컴퓨터에서 자료 지우기</button>
      </div>
      <div class="sb-foot">서버 전송 없음 · 명단은 이 브라우저 안에서만</div>
    </div>
  </aside>

  <main class="content">
    <div id="results" class="hidden">
      <div class="shead"><span class="tick"></span><h2 id="rtitle">유사 사례</h2>
        <span class="snote" id="rnote"></span></div>
      <div class="stats" id="stats"></div>
      <div id="headline"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="stu" aria-selected="true">유사 학생<span class="c" id="c-stu"></span></button>
        <button class="tab" role="tab" data-t="univ" aria-selected="false">대학·전형<span class="c" id="c-univ"></span></button>
        <button class="tab" role="tab" data-t="track" aria-selected="false">카드 배분</button>
        <button class="tab" role="tab" data-t="jg" aria-selected="false">정시<span class="c" id="c-jg"></span></button>
      </div>
      <div id="p-stu"></div>
      <div id="p-univ" class="hidden"></div>
      <div id="p-track" class="hidden"></div>
      <div id="p-jg" class="hidden"></div>
    </div>
    <div class="empty" id="placeholder">
      왼쪽에서 <b>학생을 선택</b>하면 성적이 비슷했던 졸업생들의 지원 결과가 여기에 표시됩니다.<br>
      <span class="fine">명단에 없으면 내신 전교과를 직접 입력해도 됩니다.</span>
    </div>
  </main>
</div>

<input type="file" id="f-roster" accept=".xlsx,.xls" hidden>
<input type="file" id="f-history" accept=".xlsx,.xls" hidden>

<script src="./vendor/xlsx.full.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
